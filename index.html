  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nexus Quantum OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rajdhani:wght@500;600;700;800;900&family=Share+Tech+Mono&display=swap');
      
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #000000;
        overflow: hidden;
        color: white;
        -webkit-tap-highlight-color: transparent;
        /* PERFORMANCE OPTIMIZATION */
        text-rendering: optimizeSpeed;
      }
      
      [dir="rtl"] {
        font-family: 'Cairo', sans-serif;
      }
      
      /* --- OPTIMIZED TEXTURES (Hardware Accelerated) --- */
      
      .bg-noise {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.03; /* Reduced opacity for better performance perception */
        pointer-events: none;
        z-index: 0;
        /* Force GPU Layer */
        transform: translateZ(0); 
        will-change: opacity;
      }
      
      .bg-scanlines {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
        background-size: 100% 3px;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.2;
        /* Force GPU Layer */
        transform: translateZ(0);
      }
      
      .bg-hex-grid {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2306b6d4' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        z-index: 1;
        pointer-events: none;
        transform: translateZ(0);
      }
      
      /* --- EFFICIENT GLASS --- */
      
      .glass-panel {
        background: rgba(8, 12, 20, 0.85); /* Slightly more opaque to reduce blur work */
        /* Only apply blur if device supports it well, otherwise skip */
        @supports (backdrop-filter: blur(10px)) {
            backdrop-filter: blur(12px); /* Reduced from 24px for performance */
            -webkit-backdrop-filter: blur(12px);
        }
        border-top: 1px solid rgba(6, 182, 212, 0.3);
        border-bottom: 1px solid rgba(6, 182, 212, 0.1);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      }
      
      /* --- GPU ACCELERATED CARDS --- */
      
      .holo-card {
        background: linear-gradient(160deg, rgba(20, 30, 45, 0.6) 0%, rgba(5, 10, 20, 0.9) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        position: relative;
        overflow: hidden;
        /* Using transform instead of other properties for smoother animation */
        transform: translateZ(0);
      }
      
      .holo-card.active-device {
        background: linear-gradient(160deg, rgba(6, 182, 212, 0.15) 0%, rgba(0, 0, 0, 0.9) 100%);
        border-color: rgba(6, 182, 212, 0.6);
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); /* Reduced shadow spread */
      }
      
      /* --- LOGO ANIMATION --- */
      
      .nexus-uber-logo {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 900;
        font-style: italic;
        background: linear-gradient(110deg, #06b6d4 0%, #ffffff 25%, #00ffff 50%, #ffffff 75%, #06b6d4 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine-flow 4s linear infinite;
        /* Reduced drop-shadow for performance */
        filter: drop-shadow(0 0 4px rgba(6, 182, 212, 0.6));
      }
      
      @keyframes shine-flow {
        to { background-position: 200% center; }
      }
      
      /* Scrollbar hiding */
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
